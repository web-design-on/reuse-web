openapi: 3.0.3
info:
  title: Ofertas Reuse
  description: Ações do chatbot para gerenciar as ofertas do usuário na plataforma Reuse.
  version: "1.0.0"

servers:
  - url: https://reuse-web-design-on.vercel.app

security:
  - bearerAuth: []

paths:
  /api/chatbot/offers/list-active:
    post:
      operationId: listar_ofertas_ativas
      summary: Lista as ofertas ativas do usuário
      description: >
        Retorna as ofertas com status ACTIVE do usuário, da mais recente
        para a mais antiga. Use quando o usuário quiser ver, conferir ou
        escolher entre as suas ofertas.
      parameters:
        - in: header
          name: x-reuse-user-id
          required: true
          description: ID numérico do usuário logado.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  description: Quantidade máxima de ofertas (padrão 20).
      responses:
        "200":
          description: Ofertas ativas do usuário.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  total:
                    type: integer
                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        price:
                          type: number
                        status:
                          type: string
                          enum: [ACTIVE, PAUSED]
        "401":
          description: Token inválido ou usuário não identificado.

  /api/chatbot/offers/pause:
    post:
      operationId: pausar_ofertas
      summary: Pausa ofertas ativas do usuário
      description: >
        Muda para PAUSED o status de ofertas ativas. Envie pauseAll=true para
        pausar todas, ou offerIds com os IDs específicos (obtidos antes com
        listar_ofertas_ativas). Só use depois de o usuário confirmar.
      parameters:
        - in: header
          name: x-reuse-user-id
          required: true
          description: ID numérico do usuário logado.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pauseAll:
                  type: boolean
                  description: Se true, pausa todas as ofertas ativas.
                offerIds:
                  type: array
                  items:
                    type: integer
                  description: IDs das ofertas a pausar. Ignorado se pauseAll for true.
      responses:
        "200":
          description: Ofertas pausadas.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  pausedCount:
                    type: integer
                  pausedOfferIds:
                    type: array
                    items:
                      type: integer
        "400":
          description: Corpo inválido (nem pauseAll nem offerIds válidos).
        "401":
          description: Token inválido ou usuário não identificado.
        "403":
          description: Alguma oferta não pertence ao usuário ou não está ativa.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer